services:
  db:
    image: postgres:16-alpine
    container_name: data_logger_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_logger}
      POSTGRES_USER: ${POSTGRES_USER:-data_logger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_logger_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
